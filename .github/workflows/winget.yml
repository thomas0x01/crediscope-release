name: winget
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '正式版 tag（vX.Y.Z，无后缀；beta/test 拒绝）'
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    # 看守上限 75 分钟 + 开 PR/应答余量（脚本内 WINGET_AUTO_ANSWER_MINUTES 调）
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit winget manifest PR
        run: python3 scripts/winget_update.py "${{ inputs.release_tag }}"
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
