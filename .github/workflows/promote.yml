name: Promote to Latest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已构建的正式候选 tag（vX.Y.Z）'
        required: true
      golden_run_ref:
        description: '主仓 docs/testing/golden-runs 下的 Windows 九项回执文件名'
        required: true
      macos_evidence_ref:
        description: '同目录下的 macOS DMG 安装与原生更新回执文件名'
        required: true

permissions:
  contents: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Checkout application history and latest private evidence
        uses: actions/checkout@v5
        with:
          repository: thomas0x01/crediscope-llm
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUILD_PAT }}
          persist-credentials: false
          path: src
      - name: Verify candidate, platform receipts and generated outputs, then promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ inputs.release_tag }}
          WINDOWS_EVIDENCE: ${{ inputs.golden_run_ref }}
          MACOS_EVIDENCE: ${{ inputs.macos_evidence_ref }}
        run: |
          python3 scripts/release_publish.py promote --source src --tag "$TAG" \
            --windows-evidence "$WINDOWS_EVIDENCE" --macos-evidence "$MACOS_EVIDENCE"
