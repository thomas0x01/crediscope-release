  publish-manifest:
    if: github.ref == 'refs/heads/main'
    needs: [test, build-macos, build-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Checkout the tested source for signatures and rendering
        uses: actions/checkout@v5
        with:
          repository: thomas0x01/crediscope-llm
          ref: ${{ needs.test.outputs.source_sha }}
          token: ${{ secrets.BUILD_PAT }}
          persist-credentials: false
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: staged/macos
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: staged/windows
      - name: Verify and publish candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: true
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ inputs.release_tag }}
          NOTES: ${{ inputs.notes }}
          PRE_TAG: ${{ inputs.pre_tag }}
          SOURCE_SHA: ${{ needs.test.outputs.source_sha }}
          BUILD_ID: ${{ needs.test.outputs.build_id }}
        run: |
          python3 scripts/release_publish.py build --source src --tag "$TAG" \
            --sha "$SOURCE_SHA" --build-id "$BUILD_ID" --notes="$NOTES" --pre-tag="$PRE_TAG" \
            --mac staged/macos --windows staged/windows
