            # blob 静默错比（git hint 原文背书 ./ 相对形态）
            if ! git show "HEAD:./$f" | cmp -s - "$f"; then
              echo "::error::资源保真对账失败：$f 工作区与 git blob 不一致（checkout 污染？）"
              fail=1
            fi
          done <<< "$files"
          exit $fail
      - name: Read wiki_ref
        id: wikiref
        shell: bash
        run: echo "ref=$(cat src/wiki_ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout wiki content
        uses: actions/checkout@v5
        with:
          repository: thomas0x01/crediscope-wiki
          ref: ${{ steps.wikiref.outputs.ref }}
          token: ${{ secrets.BUILD_PAT }}
          path: wiki-content
          sparse-checkout: wiki

      - name: Place wiki content
        shell: bash
        run: cp -r wiki-content/wiki src/crediscope-llm/wiki

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install backend dependencies
        run: pip install --require-hashes -r src/crediscope-llm/requirements-build.lock

      - name: Stamp sidecar version
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        # sidecar 版本戳：/api/health 透出给前端版本握手（僵尸旧进程识别，
        # 2026-08-24 用户实证 v0.1.19 前端打 v0.1.18 后端新端点 405）
        run: |
          version=${TAG#v}
          echo "VERSION = \"$version\"" > src/crediscope-llm/build_version.py
          echo "CREDISCOPE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare sidecar
        env:
          RESOURCE_KEY_PASSPHRASE: ${{ secrets.RESOURCE_KEY_PASSPHRASE }}
          CREDISCOPE_SOURCE_SHA: ${{ needs.test.outputs.source_sha }}
          CREDISCOPE_RELEASE_BUILD_ID: ${{ needs.test.outputs.build_id }}
        run: bash src/desktop/scripts/prepare-sidecar.sh

      - name: Sidecar smoke test (with mini analysis)
        run: python3 src/desktop/scripts/sidecar_smoke.py --server src/crediscope-llm/dist/crediscope-server --app-root src/crediscope-llm --mini-analysis

      - name: Sync desktop version
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          python3 src/desktop/scripts/bump-version.py "${VERSION}"

      - name: Build Tauri (Apple Silicon)
        env:
          RESOURCE_KEY_PASSPHRASE: ${{ secrets.RESOURCE_KEY_PASSPHRASE }}
          CREDISCOPE_SOURCE_SHA: ${{ needs.test.outputs.source_sha }}
          CREDISCOPE_RELEASE_BUILD_ID: ${{ needs.test.outputs.build_id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test "$CREDISCOPE_RELEASE_BUILD_ID" = "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" || { echo "Rerun all jobs to rebuild both platforms"; exit 1; }
          cd src/desktop
          npm install
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Stage exact platform assets
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.test.outputs.source_sha }}
          BUILD_ID: ${{ needs.test.outputs.build_id }}
        run: |
          python scripts/release_candidate.py stage --tag "$TAG" --sha "$SOURCE_SHA" --build-id "$BUILD_ID" \
            --source src --platform darwin-aarch64 \
            --bundle src/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle --out staged

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: staged/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

