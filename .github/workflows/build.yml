name: Build Desktop Release

# 公开构建/发布枢纽：手动触发，用只读 PAT 临时 checkout 私有源码仓库
# （thomas0x01/crediscope-llm）到 runner，构建完成后 runner 即销毁。
# 源码不进入本仓库，只有制品发布到 Release（即对外下载站）。
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '私有仓库 crediscope-llm 的 ref（分支/tag/sha）'
        required: true
        default: 'main'
      release_tag:
        description: '本仓库 release 的 tag（如 v0.1.0-test.16）'
        required: true
      notes:
        description: '下载页更新说明（;分隔多条，可空）'
        required: false
        default: ''
      pre_tag:
        description: '下载页内测版 tag（可空，如 v0.1.0-test.25）'
        required: false
        default: ''

jobs:
  # 测试门禁：全量 pytest（含冻结模拟 L0）不过则不构建，
  # 防"忘了跑测试"——回归测试不靠记忆生效
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: thomas0x01/crediscope-llm
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.BUILD_PAT }}
          path: src

      # wiki 内容仓拆分（2026-08-03）：主仓不再有 wiki/，按 src/wiki_ref
      # 锚定的 ref 从内容仓拉取并摆回原位，后续构建/测试步骤无感

      # 行尾卫生闸（2026-10-02 beta.4 贵州建投缺章案）：hub Windows 构建机
      # autocrlf 曾把模板 LF→CRLF 检出，加密后带 \r 进渲染管线塌掉中段章节。
      # .gitattributes（eol=lf）是根治；本闸 fail-fast 防属性文件失效/被删。
      - name: Guard CRLF in text resources
        shell: bash
        run: |
          cd src
          bad=$(git ls-files --eol -- '*.md' '*.json' | grep 'w/crlf' || true)
          if [ -n "$bad" ]; then
            echo "::error::文本资源以 CRLF 检出（.gitattributes 失效？）"
            echo "$bad" | head -5
            exit 1
          fi

      # 资源保真对账（2026-10-03 backlog①，beta.4 CRLF 案复盘定谳）：加密源
      # 工作区文件必须与 git blob 逐字节一致——行尾闸只盯 CRLF，本对账网住
      # 一切「构建机工作区≠仓库源」类漂移（大小 508B 的 CRLF 案即栽在此处）。
      - name: Resource fidelity vs git blobs
        shell: bash
        run: |
          # 二轮蓝队 2026-10-03 旁发现修复：原 `cd src` 后 import
          # scripts.encrypt_resources 必 ModuleNotFoundError（真身在
          # src/crediscope-llm/scripts/），且 < <(...) 失败不传播→while 零
          # 迭代 exit 0——闸自上线以来纯空洞通过。改 cd 到 app 根+清单
          # 捕获失败即 exit 1（fail-closed）。
          cd src/crediscope-llm
          files=$(python -c "from pathlib import Path; import sys; sys.path.insert(0,'.'); sys.stdout.reconfigure(newline='\n'); from scripts.encrypt_resources import discover_resources; [print(p.relative_to(Path.cwd())) for p in discover_resources()]") || { echo "::error::保真闸清单生成失败（discover_resources 不可导入）"; exit 1; }
          fail=0
          while IFS= read -r f; do
            f="${f%$'\r'}"
            [ -n "$f" ] || continue
            # HEAD:./ 前缀：$f 相对 app 根（cwd），git 缺省从仓库根解析——
            # 37131387023 实证 59 条假阳性，且仓库根同名 AGENTS.md 会撞错
            # blob 静默错比（git hint 原文背书 ./ 相对形态）
            if ! git show "HEAD:./$f" | cmp -s - "$f"; then
              echo "::error::资源保真对账失败：$f 工作区与 git blob 不一致（checkout 污染？）"
              fail=1
            fi
          done <<< "$files"
          exit $fail
      - name: Read wiki_ref
        id: wikiref
        shell: bash
        run: echo "ref=$(cat src/wiki_ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout wiki content
        uses: actions/checkout@v5
        with:
          repository: thomas0x01/crediscope-wiki
          ref: ${{ steps.wikiref.outputs.ref }}
          token: ${{ secrets.BUILD_PAT }}
          path: wiki-content
          sparse-checkout: wiki

      - name: Place wiki content
        shell: bash
        run: cp -r wiki-content/wiki src/crediscope-llm/wiki

      # 防忘 bump：wiki_ref 落后内容仓 main 时黄条警告（不阻断——有时是故意钉版）
      - name: Wiki freshness check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILD_PAT }}
        run: |
          PINNED=$(cat src/wiki_ref)
          LATEST=$(gh api repos/thomas0x01/crediscope-wiki/commits/main --jq .sha) || exit 0
          if [ "$PINNED" = "$LATEST" ]; then
            echo "wiki_ref 与内容仓 main 一致 ✓"
          else
            COUNT=$(gh api "repos/thomas0x01/crediscope-wiki/compare/${PINNED}...${LATEST}" --jq '.ahead_by // "?"' 2>/dev/null || echo "?")
            echo "::warning::wiki_ref 落后内容仓 main（${PINNED:0:7} → ${LATEST:0:7}，落后 ${COUNT} 个提交）。如非故意钉版：主仓跑 scripts/bump_wiki_ref.sh"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r src/crediscope-llm/requirements.txt

      - name: Install pdftotext (poppler)
        # mock LLM 端到端（tests/e2e/test_mock_full_analysis.py）真实跑提取管线
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # 前端 jsdom 行为测试依赖（与 ci.yml 同款，2026-09-05 v0.1.21 门禁
      # 漏装实证补上）。node 钉 22：jsdom 30 engines 要 >=22。
      - uses: actions/setup-node@v4
        if: hashFiles('src/crediscope-llm/package.json') != ''
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/crediscope-llm/package-lock.json

      - name: Install JS test deps (jsdom)
        if: hashFiles('src/crediscope-llm/package.json') != ''
        working-directory: src/crediscope-llm
        run: npm ci

      - name: Run tests
        working-directory: src/crediscope-llm
        run: python -m pytest tests -q

  build-macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: thomas0x01/crediscope-llm
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.BUILD_PAT }}
          path: src

      # wiki 内容仓拆分（2026-08-03）：主仓不再有 wiki/，按 src/wiki_ref
      # 锚定的 ref 从内容仓拉取并摆回原位，后续构建/测试步骤无感

      # 行尾卫生闸（2026-10-02 beta.4 贵州建投缺章案）：hub Windows 构建机
      # autocrlf 曾把模板 LF→CRLF 检出，加密后带 \r 进渲染管线塌掉中段章节。
