        shell: bash
        run: cp -r wiki-content/wiki src/crediscope-llm/wiki

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install backend dependencies
        run: pip install --require-hashes -r src/crediscope-llm/requirements-build.lock

