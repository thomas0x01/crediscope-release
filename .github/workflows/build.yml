            # HEAD:./ 前缀：$f 相对 app 根（cwd），git 缺省从仓库根解析——
            # 37131387023 实证 59 条假阳性，且仓库根同名 AGENTS.md 会撞错
            # blob 静默错比（git hint 原文背书 ./ 相对形态）
            if ! git show "HEAD:./$f" | cmp -s - "$f"; then
              echo "::error::资源保真对账失败：$f 工作区与 git blob 不一致（checkout 污染？）"
              fail=1
            fi
          done <<< "$files"
          exit $fail
      - name: Read wiki_ref
        id: wikiref
        shell: bash
        run: echo "ref=$(cat src/wiki_ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout wiki content
        uses: actions/checkout@v5
        with:
          repository: thomas0x01/crediscope-wiki
          ref: ${{ steps.wikiref.outputs.ref }}
          token: ${{ secrets.BUILD_PAT }}
          path: wiki-content
          sparse-checkout: wiki

      - name: Place wiki content
        shell: bash
        run: cp -r wiki-content/wiki src/crediscope-llm/wiki

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install backend dependencies
        run: pip install -r src/crediscope-llm/requirements.txt pyinstaller 'cython==3.3.*'

      - name: Stamp sidecar version
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        # sidecar 版本戳：/api/health 透出给前端版本握手（僵尸旧进程识别，
        # 2026-08-24 用户实证 v0.1.19 前端打 v0.1.18 后端新端点 405）
        run: echo "VERSION = \"${TAG#v}\"" > src/crediscope-llm/build_version.py

      - name: Prepare sidecar
        env:
          RESOURCE_KEY_PASSPHRASE: ${{ secrets.RESOURCE_KEY_PASSPHRASE }}
        run: bash src/desktop/scripts/prepare-sidecar.sh

      - name: Sidecar smoke test (with mini analysis)
        run: python3 src/desktop/scripts/sidecar_smoke.py --server src/crediscope-llm/dist/crediscope-server --app-root src/crediscope-llm --mini-analysis

      - name: Sync desktop version
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          python3 src/desktop/scripts/bump-version.py "${VERSION}"

      - name: Build Tauri (Apple Silicon)
        env:
          RESOURCE_KEY_PASSPHRASE: ${{ secrets.RESOURCE_KEY_PASSPHRASE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src/desktop
          npm install
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Attach macOS dmg to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          draft: false
          # 发布卫生（见私有仓 AGENTS.md）：带后缀的 tag（test/beta/rc）标 prerelease。
          # 干净版本号也先 prerelease（黄金旅程 promote 翻正，2026-10-06 拍板 B）——
          # 构建≠发布：黄金旅程门禁在 promote.yml，GitHub Latest 徽标不给未过门的版本
          prerelease: true
          generate_release_notes: true
          files: |
            src/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload updater signatures (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-macos
          path: src/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 1

